<script>
'use strict';
const KEY='vitals_recovery_v2';
const SCOPES=['https://www.googleapis.com/auth/googlehealth.sleep.readonly','https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.readonly','https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly'].join(' ');
const BASE='https://health.googleapis.com/v4/users/me/dataTypes/';
const S={clientId:'',profile:{age:null,sex:null,sleepNeed:8},days:{},synced:null,theme:'system'};
let token=null,tokenExp=0,busy=false,status='',logs=[],grantedScopes='';
const $=id=>document.getElementById(id);const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));const num=v=>{const x=parseFloat(v);return Number.isFinite(x)?x:null};const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;const pad=n=>String(n).padStart(2,'0');

function robustZ(v,a,floor){if(v==null||a.length<7)return null;const m=median(a);let scale=1.4826*(mad(a)||0);if(scale<floor)scale=floor;return clamp((v-m)/scale,-3,3)}
function avgLast(a,n){const x=a.filter(v=>v!=null&&Number.isFinite(v)).slice(-n);return x.length?mean(x):null}
function fmtDate(dt){return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`}
function todayStr(){return fmtDate(new Date())}
function addDays(s,k){const p=s.split('-').map(Number);return fmtDate(new Date(p[0],p[1]-1,p[2]+k))}
function ds(o){return `${o.year}-${pad(o.month)}-${pad(o.day)}`}
function nice(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dates(){return Object.keys(S.days).sort()}
function log(m){logs.push(m)}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v){S.clientId=v.clientId||'';S.profile=Object.assign(S.profile,v.profile||{});S.days=v.days||{};S.synced=v.synced||null;S.theme=v.theme||'system'}}catch(e){}applyTheme()}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function applyTheme(){document.documentElement.removeAttribute('data-theme');if(S.theme!=='system')document.documentElement.dataset.theme=S.theme}

async function fetchPages(type,filter,pageSize,maxPages){let out=[],pageToken='',useFilter=!!filter,usePS=!!pageSize;for(let i=0;i<maxPages;i++){const q=[];if(useFilter)q.push('filter='+encodeURIComponent(filter));if(usePS)q.push('pageSize='+pageSize);if(pageToken)q.push('pageToken='+encodeURIComponent(pageToken));let res;try{res=await fetch(BASE+type+'/dataPoints'+(q.length?'?'+q.join('&'):''),{headers:{Authorization:'Bearer '+token}})}catch(e){log(type+': network/CORS failure');throw e}if(!res.ok){const body=await res.text().catch(()=>'');if(res.status===400&&i===0&&(usePS||useFilter)){if(usePS){usePS=false;log(type+': retrying without pageSize')}else{useFilter=false;log(type+': retrying without filter')}i=-1;continue}log(`${type}: HTTP ${res.status} ${body.replace(/\s+/g,' ').slice(0,600)}`);if(res.status===401){token=null;tokenExp=0}throw new Error('HTTP '+res.status)}const j=await res.json();out.push(...(j.dataPoints||[]));pageToken=j.nextPageToken||'';if(!pageToken)break}log(`${type}: ${out.length} data points`);return out}

async function syncAll(){if(busy)return;busy=true;logs=[];if(grantedScopes)log('Granted scopes: '+grantedScopes.replaceAll('https://www.googleapis.com/auth/',''));status='Loading Google Health data…';render();const today=todayStr(),since=addDays(today,-190),activitySince=addDays(today,-190),days={};const get=k=>days[k]||(days[k]={});const jobs=[
['daily-heart-rate-variability',`daily_heart_rate_variability.date >= "${since}"`,0,8,dp=>{const o=dp.dailyHeartRateVariability,v=o&&num(o.averageHeartRateVariabilityMilliseconds);if(o&&o.date&&v!=null&&v>0)get(ds(o.date)).hrv=v}],
['daily-resting-heart-rate',`daily_resting_heart_rate.date >= "${since}"`,0,8,dp=>{const o=dp.dailyRestingHeartRate,v=o&&num(o.beatsPerMinute);if(o&&o.date&&v!=null&&v>0)get(ds(o.date)).rhr=v}],
['daily-vo2-max',`daily_vo2_max.date >= "${since}"`,0,8,dp=>{const o=dp.dailyVo2Max,v=o&&num(o.vo2Max);if(o&&o.date&&v!=null)get(ds(o.date)).vo2=v}],
['sleep',`sleep.interval.civil_end_time >= "${since}"`,0,8,dp=>{const s=dp.sleep;if(!s||!s.interval||!s.summary||(s.metadata&&s.metadata.main===false))return;const asleep=num(s.summary.minutesAsleep),inPeriod=num(s.summary.minutesInSleepPeriod),end=Date.parse(s.interval.endTime),off=parseInt(String(s.interval.endUtcOffset||'0'),10)||0;if(asleep==null||!Number.isFinite(end))return;const d=new Date(end+off*1000),key=`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`,t=get(key);t.sleepMin=(t.sleepMin||0)+asleep;t.inBed=(t.inBed||0)+(inPeriod==null?asleep:inPeriod)}],
['time-in-heart-rate-zone',`time_in_heart_rate_zone.interval.civil_start_time >= "${activitySince}"`,1000,40,dp=>{const o=dp.timeInHeartRateZone;if(!o||!o.interval||!o.heartRateZoneType)return;const c=o.interval.civilStartTime;if(!c||!c.date)return;const a=Date.parse(o.interval.startTime),b=Date.parse(o.interval.endTime),mins=Number.isFinite(a)&&Number.isFinite(b)&&b>a?(b-a)/60000:null;if(mins==null)return;const t=get(ds(c.date));t.z=t.z||{};t.z[o.heartRateZoneType]=(t.z[o.heartRateZoneType]||0)+mins}]
];let ok=0;for(const j of jobs){status='Loading '+j[0].replaceAll('-',' ')+'…';render();try{(await fetchPages(j[0],j[1],j[2],j[3])).forEach(j[4]);ok++}catch(e){}}
Object.values(days).forEach(d=>{if(d.sleepMin!=null){d.sleepH=Math.round(d.sleepMin/6)/10;d.eff=d.inBed>0?Math.min(100,d.sleepMin/d.inBed*100):null}});if(ok){Object.assign(S.days,days);S.synced=new Date().toISOString();save();status=''}else status='No data could be loaded. See Sync details.';busy=false;render()}
function connect(){if(!S.clientId)return;if(token&&Date.now()<tokenExp)return syncAll();if(!(window.google&&google.accounts&&google.accounts.oauth2)){status='Google sign-in is still loading. Try again shortly.';return render()}const c=google.accounts.oauth2.initTokenClient({client_id:S.clientId,scope:SCOPES,include_granted_scopes:false,callback:r=>{if(r&&r.access_token){grantedScopes=r.scope||'';token=r.access_token;tokenExp=Date.now()+((r.expires_in||3000)-60)*1000;syncAll()}else{status='Sign-in did not complete.';render()}},error_callback:e=>{status='Sign-in was closed or blocked ('+((e&&e.type)||'error')+').';render()}});c.requestAccessToken({prompt:''})}

const ZW={LIGHT:.1,MODERATE:2,VIGOROUS:3.5,PEAK:5};
function trimpForDay(d){if(!d||!d.z)return null;let t=0,seen=false;Object.keys(d.z).forEach(k=>{const m=num(d.z[k]);if(m!=null){seen=true;t+=m*(ZW[k]??1)}});return seen?t:null}
function sleepScoreForDay(d){if(!d||d.sleepH==null)return null;const need=clamp(num(S.profile.sleepNeed)||8,6,10),duration=clamp(100*d.sleepH/need,0,110),eff=d.eff==null?null:clamp(100*(d.eff-70)/20,0,100);return Math.round(clamp(eff==null?duration:.75*duration+.25*eff,0,100))}
function weightedMean(parts){const u=parts.filter(p=>p.v!=null&&Number.isFinite(p.v)&&p.w>0),w=u.reduce((s,p)=>s+p.w,0);return w?u.reduce((s,p)=>s+p.w*p.v,0)/w:null}
function scoresFor(date){const d=S.days[date],out={sleep:null,strain:null,trimp:0,recovery:null,recoveryLow:null,recoveryHigh:null,confidence:0,status:'building',components:{},note:'',flags:[]};if(!d)return out;const all=dates(),idx=all.indexOf(date),prior=all.filter(k=>k<date).slice(-42).map(k=>S.days[k]);out.sleep=sleepScoreForDay(d);const trimp=trimpForDay(d);if(trimp!=null){out.trimp=Math.round(trimp);out.strain=Math.round(21*(1-Math.exp(-trimp/250))*10)/10}
const recentHrv=prior.slice(-6).concat(d).filter(x=>x.hrv>0).map(x=>Math.log(x.hrv));const hrvSignal=avgLast(recentHrv,3);let hrvBase=prior.slice(-35,-7).filter(x=>x.hrv>0).map(x=>Math.log(x.hrv));if(hrvBase.length<7)hrvBase=prior.slice(-28).filter(x=>x.hrv>0).map(x=>Math.log(x.hrv));const hrvZ=robustZ(hrvSignal,hrvBase,.06);out.components.hrv=hrvZ;
const rhrSignal=avgLast(prior.slice(-2).concat(d).filter(x=>x.rhr>0).map(x=>x.rhr),3),rhrBase=prior.slice(-28).filter(x=>x.rhr>0).map(x=>x.rhr),rhrZ=robustZ(rhrSignal,rhrBase,1.5);out.components.rhr=rhrZ==null?null:-rhrZ;
const recentSleep=prior.slice(-6).concat(d).map(sleepScoreForDay).filter(v=>v!=null),sleepAvg=avgLast(recentSleep,7),sleepSignal=recentSleep.length?.65*(out.sleep??sleepAvg)+.35*sleepAvg:null;out.components.sleep=sleepSignal==null?null:clamp((sleepSignal-80)/12,-2.5,2.5);
const yesterday=idx>0?S.days[all[idx-1]]:null,yLoad=trimpForDay(yesterday),loadBase=prior.slice(-28).map(trimpForDay).filter(v=>v!=null),loadZ=robustZ(yLoad,loadBase,25);out.components.load=loadZ==null?null:-Math.max(0,loadZ);
const parts=[{w:.45,v:out.components.hrv},{w:.25,v:out.components.rhr},{w:.25,v:out.components.sleep},{w:.05,v:out.components.load}],comp=weightedMean(parts),available=parts.filter(p=>p.v!=null).reduce((s,p)=>s+p.w,0),baselineDays=Math.min(hrvBase.length,rhrBase.length);out.confidence=Math.round(100*clamp(available*(baselineDays/21),0,1));if(hrvZ!=null&&hrvZ<-1)out.flags.push('HRV trend is below baseline');if(out.components.rhr!=null&&out.components.rhr<-1)out.flags.push('Resting HR is above baseline');if(out.sleep!=null&&out.sleep<70)out.flags.push('Sleep was below target');if(loadZ!=null&&loadZ>1.5)out.flags.push('Yesterday’s load was unusually high');if(comp==null||available<.55||baselineDays<7){out.note=baselineDays<7?`Needs about ${7-baselineDays} more baseline day${7-baselineDays===1?'':'s'}.`:'Not enough usable signals.';return out}out.recovery=Math.round(100/(1+Math.exp(-(.95*clamp(comp,-2.5,2.5)+.3))));const u=out.confidence>=80?6:out.confidence>=60?10:14;out.recoveryLow=clamp(out.recovery-u,0,100);out.recoveryHigh=clamp(out.recovery+u,0,100);out.status=out.recovery>=67?'ready':out.recovery>=34?'caution':'recover';out.note=`Estimated range ${out.recoveryLow}–${out.recoveryHigh}; confidence ${out.confidence}%.`;return out}
function valuesThrough(date,key,daysBack){
  const first=addDays(date,-daysBack+1);
  return dates().filter(k=>k>=first&&k<=date).map(k=>S.days[k]&&S.days[k][key]).filter(v=>v!=null&&Number.isFinite(v));
}
function averageDailyZoneMinutes(date,daysBack){
  const first=addDays(date,-daysBack+1),keys=dates().filter(k=>k>=first&&k<=date);
  if(!keys.length)return null;
  let total=0,valid=0;
  keys.forEach(k=>{const d=S.days[k];if(!d||!d.z)return;valid++;Object.values(d.z).forEach(v=>{if(Number.isFinite(v))total+=v})});
  return valid?total/valid:null;
}
function vo2FitnessAge(vo2,sex){
  /* HUNT3 age-band means represented at band midpoints. Interpolation creates
     a continuous population-reference comparison, not a clinical age. */
  const norms=sex==='m'
    ? [[25,54],[35,49],[45,47],[55,42],[65,39],[75,34]]
    : [[25,43],[35,40],[45,38],[55,34],[65,31],[75,27]];
  if(vo2>=norms[0][1]){
    const slope=(norms[1][0]-norms[0][0])/(norms[1][1]-norms[0][1]);
    return clamp(norms[0][0]+slope*(vo2-norms[0][1]),18,90);
  }
  for(let i=0;i<norms.length-1;i++){
    const [a1,v1]=norms[i],[a2,v2]=norms[i+1];
    if(vo2<=v1&&vo2>=v2)return a1+(v1-vo2)/(v1-v2)*(a2-a1);
  }
  const n=norms.length,slope=(norms[n-1][0]-norms[n-2][0])/(norms[n-1][1]-norms[n-2][1]);
  return clamp(norms[n-1][0]+slope*(vo2-norms[n-1][1]),18,90);
}
function healthspanSnapshot(date,windowDays){
  const p=S.profile;if(!p.age||!p.sex)return null;
  const vo2s=valuesThrough(date,'vo2',windowDays),vo2=vo2s.length?median(vo2s):null;
  if(vo2==null)return null;
  const anchor=vo2FitnessAge(vo2,p.sex);
  const sleeps=valuesThrough(date,'sleepH',windowDays),sleep=sleeps.length?mean(sleeps):null;
  const rhrs=valuesThrough(date,'rhr',windowDays),rhr=rhrs.length?median(rhrs):null;
  const activity=averageDailyZoneMinutes(date,windowDays);
  const need=clamp(num(p.sleepNeed)||8,6,10);

  /* Transparent wellness modifiers. These are deliberately small and capped.
     They are product calibration, not coefficients from KDM, PhenoAge or WHOOP. */
  const sleepDelta=sleep==null?0:clamp((need-sleep)*1.25,-2,2);
  const rhrDelta=rhr==null?0:clamp((rhr-65)/7,-2,2);
  const activityDelta=activity==null?0:clamp((25-activity)/12.5,-2,2);
  const modifiers=sleepDelta+rhrDelta+activityDelta;
  const age=clamp(anchor+modifiers,p.age-15,p.age+15);
  const validDays=new Set([
    ...dates().filter(k=>k<=date&&k>=addDays(date,-windowDays+1)&&S.days[k].sleepH!=null),
    ...dates().filter(k=>k<=date&&k>=addDays(date,-windowDays+1)&&S.days[k].rhr!=null)
  ]).size;
  const confidence=Math.round(100*clamp((vo2s.length?0.45:0)+(Math.min(validDays,90)/90)*0.35+(activity!=null?0.20:0),0,1));
  return {age,anchor,vo2,sleep,rhr,activity,confidence,validDays,windowDays,adjustments:{sleep:sleepDelta,rhr:rhrDelta,activity:activityDelta}};
}
function healthspanAge(date){
  const long=healthspanSnapshot(date,180);if(!long)return null;
  const recent=healthspanSnapshot(date,30);
  let pace=null;
  if(recent&&recent.validDays>=21){
    /* Directional lifestyle trend centred at 1.00x. It is not literal
       biological aging over 30 days; cap prevents false precision. */
    pace=clamp(1+(recent.age-long.age)/5,0.5,1.5);
  }
  return Object.assign({},long,{pace,recentAge:recent&&recent.age});
}

function recColor(v){return v>=67?'var(--good)':v>=34?'var(--mid)':'var(--bad)'}function sleepColor(v){return v>=85?'var(--good)':v>=70?'var(--mid)':'var(--bad)'}
function spark(vals,color){const pts=[];vals.forEach((v,i)=>{if(v!=null)pts.push([i,v])});if(pts.length<2)return '<span class="small muted">not enough data</span>';const ys=pts.map(p=>p[1]),mn=Math.min(...ys),mx=Math.max(...ys),rng=mx-mn||1,W=160,H=44,N=vals.length-1||1,path=pts.map(p=>`${(p[0]/N*W).toFixed(1)},${(H-4-(p[1]-mn)/rng*(H-8)).toFixed(1)}`).join(' '),l=pts.at(-1);return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend"><polyline points="${path}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${(l[0]/N*W).toFixed(1)}" cy="${(H-4-(l[1]-mn)/rng*(H-8)).toFixed(1)}" r="3.2" fill="${color}"/></svg>`}
function meter(label,value,frac,color,sub){return `<div class="meter"><div class="top"><span class="lab">${label}</span><span class="val">${value}</span></div><div class="track"><div class="fill" style="width:${clamp(frac,0,1)*100}%;background:${color}"></div></div><div class="subt">${sub}</div></div>`}
function factor(label,z,positive){if(z==null)return `<li><div><div class="factor-title">${label}</div><div class="factor-note">Not available</div></div><div class="factor-score muted">–</div></li>`;const cls=z>.65?'good':z<-.65?'bad':'mid',txt=z>.65?'Favorable':z<-.65?'Suppressed':'Normal';return `<li><div><div class="factor-title">${label}</div><div class="factor-note">${txt} versus personal baseline</div></div><div class="factor-score ${cls}">${z>0?'+':''}${z.toFixed(1)}</div></li>`}
function headerHtml(){const sync=S.clientId&&dates().length?`<button class="btn" onclick="connect()" ${busy?'disabled':''}>${busy?'Syncing…':'Sync now'}</button>`:'';return `<header><div><h1>Vitals</h1><div class="sub">${S.synced?'Last synced '+esc(new Date(S.synced).toLocaleString()):'Not synced yet'}</div></div>${sync}</header>${status?`<div class="status" role="status">${esc(status)}</div>`:''}`}
function setupHtml(){return `<section><h2>Connect Google Health</h2><p class="note">Paste your OAuth web client ID. It is stored only in this browser.</p><label for="cid">Client ID</label><input id="cid" autocomplete="off" spellcheck="false" placeholder="1234567890-abc.apps.googleusercontent.com"><div class="btns"><button class="btn primary" onclick="saveCid()">Save client ID</button></div></section>`}
function connectHtml(){return `<section><h2>Sync health data</h2><p class="note">Sign in and grant read-only access to sleep, health metrics, and activity. Health data remains in this browser.</p><button class="btn primary" onclick="connect()" ${busy?'disabled':''}>Sign in with Google</button></section>`}
function dashHtml(){const usable=dates().filter(k=>{const d=S.days[k];return d.hrv!=null||d.rhr!=null||d.sleepMin!=null});if(!usable.length)return `<section><h2>No usable data</h2><p class="note">Sync returned no HRV, resting heart rate, or sleep records. Review Sync details below.</p></section>`;const date=usable.at(-1),d=S.days[date],s=scoresFor(date),color=s.recovery==null?'rgba(255,255,255,.35)':recColor(s.recovery),f=(s.recovery||0)/100,R=90,C=2*Math.PI*R,msg=s.recovery==null?s.note:s.status==='ready'?'Signals are favorable. Train as planned if you also feel well.':s.status==='caution'?'Mixed signals. Keep intensity flexible and reassess after warm-up.':'Recovery signals are suppressed. Favor easy training or rest, especially if you feel unwell.',sleepSub=d.sleepH!=null?`${d.sleepH.toFixed(1)} h asleep${d.eff!=null?', '+Math.round(d.eff)+'% efficiency':''}`:'No sleep found';let html=`<section class="hero"><div class="date">${nice(date)}</div><div class="ringwrap"><svg viewBox="0 0 220 220" aria-label="Recovery estimate"><circle cx="110" cy="110" r="${R}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="14"/><circle cx="110" cy="110" r="${R}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(C*f).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 110 110)"/></svg><div class="ringtxt"><b>${s.recovery??'–'}</b><span>Recovery estimate</span></div></div><p class="msg">${esc(msg)}</p><p class="range">${esc(s.note)}${s.flags.length?' · '+esc(s.flags.join(' · ')):''}</p><div class="two">${meter('Strain',s.strain==null?'–':s.strain.toFixed(1),(s.strain||0)/21,'var(--info)',s.strain==null?'No zone data':`Today’s load ${s.trimp}`)}${meter('Sleep',s.sleep??'–',(s.sleep||0)/100,s.sleep==null?'rgba(255,255,255,.3)':sleepColor(s.sleep),sleepSub)}</div></section>`;
html+=`<section><h2>Recovery factors</h2><p class="note">Standardized against your own recent baseline. Positive values are favorable.</p><ul class="factors">${factor('HRV trend',s.components.hrv)}${factor('Resting heart rate',s.components.rhr)}${factor('Sleep',s.components.sleep)}${factor('Prior-day load',s.components.load)}</ul></section>`;
const hs=healthspanAge(date);html+=hs?`<section><h2>Healthspan age</h2><div class="cards"><div class="card"><div class="label">Healthspan age</div><div class="value">${hs.age.toFixed(1)}</div><div class="detail">${(hs.age-S.profile.age)<=0?Math.abs(hs.age-S.profile.age).toFixed(1)+' years younger':(hs.age-S.profile.age).toFixed(1)+' years older'}</div></div><div class="card"><div class="label">Pace indicator</div><div class="value">${hs.pace==null?'–':hs.pace.toFixed(2)+'×'}</div><div class="detail">${hs.pace==null?'Needs 21 recent valid days':'30-day trend vs long term'}</div></div><div class="card"><div class="label">VO₂ fitness-age anchor</div><div class="value">${hs.anchor.toFixed(1)}</div><div class="detail">VO₂max ${hs.vo2.toFixed(1)}</div></div><div class="card"><div class="label">Confidence</div><div class="value">${hs.confidence}%</div><div class="detail">${hs.validDays} valid trend days</div></div></div><ul class="factors"><li><div><div class="factor-title">Sleep modifier</div><div class="factor-note">Long-term sleep vs personal need</div></div><div class="factor-score ${hs.adjustments.sleep<=0?'good':'bad'}">${hs.adjustments.sleep>0?'+':''}${hs.adjustments.sleep.toFixed(1)} yr</div></li><li><div><div class="factor-title">Resting-HR modifier</div><div class="factor-note">Capped wellness calibration</div></div><div class="factor-score ${hs.adjustments.rhr<=0?'good':'bad'}">${hs.adjustments.rhr>0?'+':''}${hs.adjustments.rhr.toFixed(1)} yr</div></li><li><div><div class="factor-title">Activity modifier</div><div class="factor-note">Average recorded zone minutes</div></div><div class="factor-score ${hs.adjustments.activity<=0?'good':'bad'}">${hs.adjustments.activity>0?'+':''}${hs.adjustments.activity.toFixed(1)} yr</div></li></ul><div class="warn small">The VO₂max anchor uses published population reference values. Sleep, resting-HR and activity adjustments are transparent, capped wellness heuristics. This is not clinical biological age, KDM, PhenoAge, or WHOOP’s proprietary score.</div></section>`:`<section><h2>Healthspan age</h2><p class="note">Add age and sex in Settings and sync a VO₂max record. The estimate improves as up to 180 days of sleep, resting-heart-rate and activity data accumulate.</p></section>`;
const last=usable.slice(-14);if(last.length>=2){const row=(l,v,u)=>{const x=[...v].reverse().find(n=>n!=null);return `<div class="trow"><div><div class="tl">${l}</div><div class="tv">${x==null?'–':Math.round(x*10)/10}${u}</div></div>${spark(v,'var(--accent)')}</div>`};html+=`<section><h2>Last ${last.length} days</h2>${row('Recovery',last.map(k=>scoresFor(k).recovery),'')}${row('HRV',last.map(k=>S.days[k].hrv??null),' ms')}${row('Resting HR',last.map(k=>S.days[k].rhr??null),' bpm')}${row('Strain',last.map(k=>scoresFor(k).strain),'')}</section>`}return html}
function settingsHtml(){const p=S.profile,v=x=>x==null?'':x;return `<details><summary>Settings</summary><div class="grid" style="margin-top:12px"><div><label for="p_age">Age</label><input id="p_age" type="number" min="18" max="100" value="${v(p.age)}" onchange="setP('age',num(this.value))"></div><div><label for="p_sex">Sex used by VO₂max equation</label><select id="p_sex" onchange="setP('sex',this.value||null)"><option value="">Select</option><option value="m" ${p.sex==='m'?'selected':''}>Male</option><option value="f" ${p.sex==='f'?'selected':''}>Female</option></select></div><div><label for="p_sn">Personal sleep need</label><input id="p_sn" type="number" min="6" max="10" step="0.1" value="${v(p.sleepNeed)}" onchange="setP('sleepNeed',num(this.value))"></div><div><label for="p_theme">Theme</label><select id="p_theme" onchange="setTheme(this.value)"><option value="system" ${S.theme==='system'?'selected':''}>System</option><option value="light" ${S.theme==='light'?'selected':''}>Light</option><option value="dark" ${S.theme==='dark'?'selected':''}>Dark</option></select></div><div style="grid-column:1/-1"><label for="p_cid">Google client ID</label><input id="p_cid" value="${esc(S.clientId)}" onchange="setCid(this.value)" spellcheck="false"></div></div><div class="btns"><button id="clr" class="btn" onclick="clearAll()">Erase saved health data</button></div></details>`}
function diagHtml(){return `<details><summary>Sync details</summary><pre>${logs.length?esc(logs.join('\n')):'No sync in this session.'}</pre></details>`}
function render(){let h=headerHtml();h+=!S.clientId?setupHtml():!dates().length?connectHtml():dashHtml();h+=settingsHtml()+diagHtml()+`<div class="footer">This dashboard shows personal trend estimates, not medical advice or a diagnosis. Do not use it to override symptoms, illness, pain, or guidance from a qualified clinician.</div>`;$('app').innerHTML=h}
function saveCid(){const v=($('cid').value||'').trim();if(!v.endsWith('.apps.googleusercontent.com')){status='That does not look like a Google OAuth client ID.';return render()}S.clientId=v;status='';save();render()}
function setCid(v){S.clientId=(v||'').trim();save()}function setP(k,v){S.profile[k]=v;save();render()}function setTheme(v){S.theme=v;applyTheme();save();render()}
let armed=false;function clearAll(){const b=$('clr');if(!armed){armed=true;b.textContent='Tap again to erase';setTimeout(()=>{armed=false;const x=$('clr');if(x)x.textContent='Erase saved health data'},4000);return}S.days={};S.synced=null;armed=false;save();render()}
load();
render();
</script>
